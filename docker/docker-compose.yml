services:
  swift-latest:
    build:
      context: .
      dockerfile: Dockerfile.latest
    container_name: swiftupdatekit-latest
    volumes:
      - .:/root
    working_dir: /root
    command: swift test -c release

  swift-nightly:
    build:
      context: .
      dockerfile: Dockerfile.nightly
    container_name: swiftupdatekit-nightly
    volumes:
      - .:/root
    working_dir: /root
    command: swift test -c release