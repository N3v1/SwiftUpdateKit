name: 🐞 Report a bug
description: >
  Report a deviation from expected or documented behavior in SwiftUpdateKit.
labels: [bug, triage needed]
body:
  - type: markdown
    attributes:
      value: >
        This repository hosts SwiftUpdateKit, a Swift package for update management.
        Please ensure your report is related to SwiftUpdateKit functionality.
        For issues with Swift language or tooling, please report to the official Swift repositories.
  - type: textarea
    attributes:
      label: Description
      description: >
        A concise description of what causes the problem, in human language.
        Though not required, it may help us to more accurately triage the issue
        as well as understand a non-trivial test case.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Reproduction
      description: >
        Provide a test case, preferably in a Markdown code block, and explain
        how to build or run it to reproduce the problem.
        If the problem is a poor or unexpected diagnostic, fix-it, or other
        output, please show this output as is.
        For example, paste it from the terminal.
        Consider reducing the test case to the smallest amount of code
        possible — a smaller test case is easier to reason about and more
        appealing to contributors.
      value: |
        ```swift

        ```
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: Describe the behavior you expected.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: >
        Provide the SwiftUpdateKit version, Swift version, or other environment details.
        If you suspect the problem might be specific to a particular platform or configuration, please specify it here.
      placeholder: $ swift --version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional information
      description: >
        Any complementary information that could help others to work around
        the problem, and us to better understand the problem and its impact.
        For example, a link to a discussion or post that motivated this
        report.
    validations:
      required: false